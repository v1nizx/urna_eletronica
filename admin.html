<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apuração - PASCOM São José</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
  <div class="admin">
    <header class="admin-header">
      <img src="assets/logo-sao-jose.png" alt="Logo PASCOM São José" class="logo-urna" style="width:90px;height:90px;margin-right:16px;">
      <div style="flex:1;">
        <h1>Painel de Apura&ccedil;&atilde;o</h1>
        <div class="org">PASCOM &bull; Comunidade S&atilde;o Jos&eacute; da Provid&ecirc;ncia</div>
      </div>
    </header>

    <div class="admin-body">
      <!-- Login -->
      <section id="tela-login" class="tela active">
        <h2>Acesso restrito</h2>
        <p>Digite a senha de apura&ccedil;&atilde;o:</p>
        <input type="password" id="senha-admin" placeholder="Senha">
        <div id="msg-erro-admin" class="erro"></div>
        <button id="btn-entrar-admin" class="btn-primario" style="background:#E8A33D;color:#FFFFFF;border:2px solid #C9862D;font-weight:800;">Entrar</button>
      </section>

      <!-- Apuração -->
      <section id="tela-apuracao" class="tela">
        <div class="apuracao-header">
          <h2>Resultado da Vota&ccedil;&atilde;o</h2>
          <div class="acoes">
            <button id="btn-atualizar" class="btn-primario" style="background:#E8A33D;color:#FFFFFF;border:2px solid #C9862D;">Atualizar</button>
            <button id="btn-exportar" class="btn-outline" style="background:#FFFFFF;color:#6C757D;border:2px solid #6C757D;">Exportar CSV</button>
            <button id="btn-sair-admin" class="btn-perigo" style="background:#C0392B;color:#FFFFFF;border:2px solid #A93226;">Sair</button>
          </div>
        </div>

        <div class="total-votos" id="total-votos">Total de votos: 0</div>

        <div class="table-wrapper">
          <table id="tabela-resultado">
            <thead>
              <tr>
                <th>Pos.</th>
                <th>Candidato</th>
                <th>N&uacute;m.</th>
                <th>Coord.</th>
                <th>Vice</th>
                <th>Total</th>
                <th>Cargo</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <div id="votos-brancos-nulos"></div>
      </section>
    </div>
  </div>
</body>
</html>
